<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy Check System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #2b2b2b;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: #383838;
            width: 100%;
            max-width: 700px;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #4a4a4a;
        }

        h2 {
            margin-bottom: 20px;
            color: #ffffff;
            font-size: 20px;
            text-align: center;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px;
            background-color: #1e1e1e;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #777;
        }

        button {
            padding: 12px 20px;
            background-color: #4a4a4a;
            color: #fff;
            border: 1px solid #666;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #5a5a5a;
        }

        .console-box {
            background-color: #1a1a1a;
            border: 1px solid #444;
            border-radius: 4px;
            padding: 15px;
            height: 280px;
            overflow-y: auto;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
            line-height: 1.6;
        }

        .log-line {
            margin-bottom: 4px;
            word-break: break-all;
        }

        .text-connecting { color: #e6c547; } /* Vàng */
        .text-connected { color: #52c41a; }  /* Xanh lá */
        .text-die { color: #ff4d4f; }        /* Đỏ */
    </style>
</head>
<body>

    <div class="container">
        <h2>Proxy Check System</h2>

        <!-- Ô nhập link / IP & Nút kiểm tra -->
        <div class="input-group">
            <input type="text" id="proxyInput" placeholder="Nhập IP Proxy hoặc Link file .pac">
            <button onclick="startCheck()">Kiểm tra</button>
        </div>

        <!-- Bảng Console -->
        <div class="console-box" id="console">
            <div class="log-line" style="color: #888;">-- Bảng console sẵn sàng --</div>
        </div>
    </div>

    <script>
        const consoleBox = document.getElementById('console');

        // Ghi log ra màn hình console
        function writeLog(text, typeClass) {
            const line = document.createElement('div');
            line.className = `log-line ${typeClass}`;
            line.textContent = text;
            consoleBox.appendChild(line);
            consoleBox.scrollTop = consoleBox.scrollHeight;
        }

        // Bắt đầu luồng kiểm tra
        async function startCheck() {
            const inputVal = document.getElementById('proxyInput').value.trim();
            if (!inputVal) return;

            // Kiểm tra nếu người dùng nhập Link file PAC hoặc Link GitHub Raw
            if (inputVal.endsWith('.pac') || inputVal.includes('raw.githubusercontent.com')) {
                writeLog(`[*]fetching PAC file... ; url:[${inputVal}]`, 'text-connecting');

                try {
                    const response = await fetch(inputVal);
                    if (!response.ok) throw new Error("Lỗi khi tải file PAC");

                    const pacContent = await response.text();

                    // Tìm tất cả địa chỉ IP:Port nằm trong chuỗi PROXY
                    const proxyRegex = /PROXY\s+([a-zA-Z0-9.-]+:\d+)/g;
                    let match;
                    const extractedProxies = [];

                    while ((match = proxyRegex.exec(pacContent)) !== null) {
                        extractedProxies.push(match[1]);
                    }

                    if (extractedProxies.length === 0) {
                        writeLog(`[×]proxy die ; proxy:[${inputVal}]`, 'text-die');
                        return;
                    }

                    // Chạy kiểm tra từng Proxy tìm thấy trong file PAC
                    for (const proxy of extractedProxies) {
                        await checkSingleProxy(proxy);
                    }

                } catch (err) {
                    writeLog(`[×]proxy die ; proxy:[${inputVal}]`, 'text-die');
                }
            } 
            // Nếu người dùng nhập trực tiếp IP:Port đơn lẻ
            else {
                await checkSingleProxy(inputVal);
            }
        }

        // Hàm xử lý từng Proxy đơn lẻ
        function checkSingleProxy(proxyVal) {
            return new Promise((resolve) => {
                writeLog(`[*]connecting for server... ; poxy:[${proxyVal}]`, 'text-connecting');

                setTimeout(() => {
                    // Tỷ lệ mô phỏng phản hồi (Có thể thay thế bằng logic fetch real endpoint)
                    const isSuccess = Math.random() > 0.4;

                    if (isSuccess) {
                        writeLog(`[~]connected ; proxy:[${proxyVal}]`, 'text-connected');
                    } else {
                        writeLog(`[×]proxy die ; proxy:[${proxyVal}]`, 'text-die');
                    }
                    resolve();
                }, 1500);
            });
        }
    </script>

</body>
</html>
